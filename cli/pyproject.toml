[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "phishquest"
version = "1.5.0"
description = "Game edukasi anti-phishing berbahasa Indonesia untuk terminal (Rich)."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["rich>=13"]
keywords = ["phishing", "security-awareness", "education", "game", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Education",
  "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
phishquest = "phishquest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phishquest"]

[tool.hatch.build.targets.wheel.force-include]
"../content" = "phishquest/content_data"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/phishquest/content_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["phishquest"]
