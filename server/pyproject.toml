[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "phishquest-server"
version = "2.2.2"
description = "Backend papan skor online anonim untuk PhishQuest (opsional)."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
keywords = ["phishing", "security-awareness", "education", "leaderboard"]
classifiers = [
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
phishquest-server = "phishquest_server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phishquest_server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["phishquest_server"]
